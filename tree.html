<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Дерево связей — тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Manrope:wght@300;400;500&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root{
    --obsidian:#07060a; --gold:#C5A55A; --gold-soft:#e6c878; --gold-deep:#7c5e29;
    --pearl:#e6ddc9; --pearl-mute:#8b8578; --line:rgba(197,165,90,0.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 20%, #0d0b12 0%, var(--obsidian) 60%, #050409 100%);
    color:var(--pearl); font-family:'Manrope',sans-serif; overflow:hidden;
  }
  a{color:var(--gold)} a:hover{color:var(--gold-soft)}
  .head{position:fixed; top:22px; left:0; right:0; text-align:center; z-index:20; pointer-events:none}
  .head .kick{font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.5em; text-transform:uppercase; color:var(--gold); opacity:.85}
  .head .sub{margin-top:8px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:16px; color:var(--pearl-mute)}
  .fit{position:fixed; inset:0; display:flex; align-items:center; justify-content:center}
  .stage{position:relative; transform-origin:center center}
  svg.threads{position:absolute; inset:0; overflow:visible; pointer-events:none}
  .thread-glow{stroke:var(--gold); stroke-width:3.4; fill:none; opacity:.10; filter:url(#soft); transition:opacity .4s ease}
  .thread-core{stroke:var(--gold-soft); stroke-width:1.25; fill:none; opacity:.5; stroke-linecap:round;
    stroke-dasharray:4 16; animation:flow 3.4s linear infinite; transition:opacity .4s ease, stroke-width .4s ease}
  @keyframes flow{to{stroke-dashoffset:-40}}
  .edge.spine .thread-core{opacity:.32; animation-duration:6s}
  .edge.is-hot .thread-core{opacity:1; stroke-width:1.9}
  .edge.is-hot .thread-glow{opacity:.42}
  .stage.focusing .edge:not(.is-hot) .thread-core{opacity:.08}
  .stage.focusing .edge:not(.is-hot) .thread-glow{opacity:.03}

  .node{position:absolute; z-index:5; cursor:pointer; transition:opacity .35s ease}
  .node .disc{
    width:100%; height:100%; border-radius:50%; overflow:hidden; position:relative;
    border:1px solid rgba(197,165,90,0.4);
    box-shadow:0 10px 30px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.4);
    background:#100d14; transition:border-color .35s ease, box-shadow .35s ease, transform .35s ease;
  }
  .node .disc img{width:100%; height:100%; object-fit:cover; display:block; filter:saturate(.92) contrast(1.02)}
  .node .disc .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(197,165,90,0.5)}
  .node .disc .ph svg{width:44%;height:44%}
  .node .nm{
    position:absolute; top:calc(100% + 9px); left:50%; transform:translateX(-50%); white-space:nowrap;
    font-family:'Cinzel',serif; font-weight:500; font-size:12.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--pearl); text-shadow:0 2px 10px rgba(0,0,0,0.8); transition:color .35s ease;
  }
  .node .role{
    position:absolute; top:calc(100% + 29px); left:50%; transform:translateX(-50%); white-space:nowrap;
    font-size:10px; letter-spacing:0.08em; color:var(--pearl-mute); opacity:0; transition:opacity .35s ease;
  }
  .node:hover .disc, .node.is-active .disc{border-color:var(--gold); box-shadow:0 14px 40px rgba(0,0,0,0.6), 0 0 30px rgba(197,165,90,0.28); transform:translateY(-2px)}
  .node:hover .nm{color:var(--gold-soft)}
  .node:hover .role{opacity:1}
  .node.is-dim{opacity:.28}

  /* center hubs */
  .node.center .disc{border-width:2px; border-color:rgba(197,165,90,0.6); box-shadow:0 16px 46px rgba(0,0,0,0.6), 0 0 46px rgba(197,165,90,0.22)}
  .node.center::before{
    content:""; position:absolute; inset:-26%; border-radius:50%; z-index:-1; pointer-events:none;
    background:radial-gradient(circle, rgba(197,165,90,0.22) 0%, rgba(197,165,90,0) 68%);
  }
  .node.center .nm{font-size:15px; letter-spacing:0.16em; color:var(--gold)}
  /* command hub */
  .node.hub .disc{border-color:rgba(197,165,90,0.5)}

  .legend{position:fixed; bottom:18px; left:0; right:0; text-align:center; z-index:20; font-size:11px; letter-spacing:0.12em; color:var(--pearl-mute); pointer-events:none}
</style>
</head>
<body>
<div class="head">
  <div class="kick">Дерево связей</div>
  <div class="sub">наведите на портрет, чтобы увидеть его нити</div>
</div>
<div class="fit">
  <div class="stage" id="stage">
    <svg class="threads" id="threads">
      <defs>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" /></filter>
      </defs>
      <g id="edgeLayer"></g>
    </svg>
    <div id="nodeLayer"></div>
  </div>
</div>
<div class="legend">тестовая область · связи персонажей книги I</div>

<script>
const BW = 1780, BH = 1200;
const C = 'assets/chars/';
const RS = 1.34; // portrait size multiplier

// x,y = center in design space; r = radius
const NODES = [
  // ---- central trio ----
  { id:'ray',    name:'Рэй',    role:'принцесса',        img:C+'ray.jpg',     x:430,  y:560, r:82, cls:'center' },
  { id:'loran',  name:'Лоран',  role:'король Торнхолла', img:C+'loran.jpg',   x:960,  y:500, r:82, cls:'center' },
  { id:'azarin', name:'Азарин', role:'державец',         img:C+'azarin.jpg',  x:1450, y:520, r:82, cls:'center' },
  // ---- Рэй: свита ----
  { id:'tata',   name:'Тата',   role:'служанка',         img:C+'tata.jpg',    x:180,  y:300, r:52 },
  { id:'marla',  name:'Марла',  role:'служанка',         img:C+'marla.jpg',   x:170,  y:560, r:52 },
  { id:'mark',   name:'Марк',   role:'жнец',             img:C+'mark.jpg',    x:470,  y:830, r:52 },
  { id:'krinya', name:'Криня',  role:'жнец',             img:C+'krinya.jpg',  x:660,  y:900, r:52 },
  { id:'yurt',   name:'Юрт',    role:'жнец',             img:C+'yurt.jpg',    x:850,  y:840, r:52 },
  { id:'comander',name:'Командир',role:'глава жнецов',   img:C+'comander.jpg',x:640,  y:1090,r:60, cls:'hub' },
  // ---- Лоран: двор ----
  { id:'rovenna',name:'Ровенна',role:'королева',         img:C+'rovenna.jpg', x:960,  y:220, r:52 },
  { id:'garon',  name:'Гарон',  role:'советник',         img:C+'garon.jpg',   x:1210, y:330, r:52 },
  { id:'morva',  name:'Морва',  role:'мать Ровенны',     img:C+'morva.jpg',   x:1230, y:660, r:52 },
  // ---- Азарин ----
  { id:'esmar',  name:'Эсмар',  role:'жена Азарина',     img:C+'esmar.jpg',   x:1650, y:290, r:52 }
];

const EDGES = [
  ['ray','loran','spine'], ['loran','azarin','spine'],
  ['ray','tata'], ['ray','marla'], ['ray','mark'], ['ray','krinya'], ['ray','yurt'],
  ['mark','comander'], ['krinya','comander'], ['yurt','comander'],
  ['loran','rovenna'], ['loran','garon'], ['loran','morva'],
  ['azarin','esmar']
];

const BUST = '<span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"><circle cx="12" cy="9" r="4"/><path d="M5 20c0-4.5 3-6.6 7-6.6s7 2.1 7 6.6"/></svg></span>';

const stage = document.getElementById('stage');
stage.style.width = BW+'px'; stage.style.height = BH+'px';
const svg = document.getElementById('threads');
svg.setAttribute('viewBox', `0 0 ${BW} ${BH}`);
svg.setAttribute('width', BW); svg.setAttribute('height', BH);

const byId = {}; NODES.forEach(n=>byId[n.id]=n);

// edges
const edgeLayer = document.getElementById('edgeLayer');
function edgePath(a,b,curve){
  const x1=a.x,y1=a.y,x2=b.x,y2=b.y;
  const mx=(x1+x2)/2,my=(y1+y2)/2, dx=x2-x1,dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len, k=(curve==null?0.14:curve)*len;
  return `M${x1} ${y1} Q${mx+nx*k} ${my+ny*k} ${x2} ${y2}`;
}
const edgeEls = EDGES.map((e)=>{
  const a=byId[e[0]], b=byId[e[1]], spine=e[2]==='spine';
  const d=edgePath(a,b, spine?0.05:0.14);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','edge'+(spine?' spine':''));
  g.innerHTML = `<path class="thread-glow" d="${d}"/><path class="thread-core" d="${d}"/>`;
  edgeLayer.appendChild(g);
  return {g, a:e[0], b:e[1]};
});

// nodes
const nodeLayer = document.getElementById('nodeLayer');
const nodeEls = NODES.map(n=>{
  const el=document.createElement('div');
  el.className='node'+(n.cls?' '+n.cls:'');
  el.dataset.id=n.id;
  const r=(n.cls?n.r:n.r*1.28)*RS;
  el.style.left=(n.x-r)+'px'; el.style.top=(n.y-r)+'px';
  el.style.width=el.style.height=(r*2)+'px';
  el.innerHTML = `<div class="disc">${n.img?`<img src="${n.img}" alt="${n.name}" loading="lazy">`:BUST}</div><div class="nm">${n.name}</div><div class="role">${n.role}</div>`;
  nodeLayer.appendChild(el);
  return el;
});

function neighbors(id){
  const s=new Set([id]);
  EDGES.forEach(e=>{ if(e[0]===id)s.add(e[1]); if(e[1]===id)s.add(e[0]); });
  return s;
}
function focus(id){
  stage.classList.add('focusing');
  edgeEls.forEach(e=>e.g.classList.toggle('is-hot', e.a===id||e.b===id));
  const nb=neighbors(id);
  nodeEls.forEach(el=>{
    el.classList.toggle('is-dim', !nb.has(el.dataset.id));
    el.classList.toggle('is-active', el.dataset.id===id);
  });
}
function unfocus(){
  stage.classList.remove('focusing');
  edgeEls.forEach(e=>e.g.classList.remove('is-hot'));
  nodeEls.forEach(el=>el.classList.remove('is-dim','is-active'));
}
nodeEls.forEach(el=>{
  el.addEventListener('mouseenter',()=>focus(el.dataset.id));
  el.addEventListener('mouseleave',unfocus);
});

function fit(){
  const s=Math.min((window.innerWidth-56)/BW, (window.innerHeight-150)/BH);
  stage.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit); fit();
</script>
</body>
</html>
